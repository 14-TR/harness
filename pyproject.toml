[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-harness"
version = "0.1.0"
description = "A small, streaming, composable Python agent loop."
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
research = ["pypdf>=5,<6"]

[project.scripts]
harness = "harness.cli:main"
harness-research = "harness.research:main"

[tool.setuptools.packages.find]
include = ["harness*"]
